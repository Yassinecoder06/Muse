server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Images remain limited to 5 MB by Express; research source documents are
    # allowed up to 10 MB, so leave a small margin for request overhead.
    client_max_body_size 11m;

    location = /health {
        proxy_pass http://server:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Audio streaming: disable buffering for instant range/chunk streaming without disk buffering
    location /api/music/stream/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Express and the AI worker run as an internal Compose service.
    location /api/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        # Bip can run several model/tool rounds and research reports take
        # minutes; nginx's 60s default turned slow replies into 504s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Auth (GoTrue) - direct proxy replacing Kong
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase PostgREST - direct proxy replacing Kong
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
