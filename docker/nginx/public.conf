# Public gateway for Cloudflare Tunnel / external MCP clients.
# Only exposes the MCP endpoint, OAuth 2.1 metadata & auth flows,
# approval pages, and health checks. Everything else returns 404.

map $http_x_forwarded_proto $public_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Only cloudflared reaches this port (8081 is not published), so Cloudflare's
# CF-Connecting-IP is the real client address; rate limits key on it.
map $http_cf_connecting_ip $public_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 8081;
    server_name _;

    client_max_body_size 11m;

    # Everything else returns 404
    location / {
        return 404;
    }

    # Health check for tunnel and container monitoring
    location = /health {
        proxy_pass http://server:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    }

    # Streamable HTTP MCP endpoint (long-lived connections, SSE, chunked streaming)
    location = /mcp {
        proxy_pass http://server:3002/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    }

    location /mcp/ {
        proxy_pass http://server:3002/mcp/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    }

    # OAuth 2.1 endpoints (register, authorize, token, revoke)
    location /oauth/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    }

    # RFC 9207 / OAuth 2.1 metadata discovery
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://server:3002/.well-known/oauth-protected-resource;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://server:3002/.well-known/oauth-authorization-server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    }

    # Human-in-the-loop tool approvals (/approve/:id)
    location /approve/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $public_client_ip;
        proxy_set_header X-Forwarded-For $public_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    }
}
