name: muse
services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-32-character-minimum-secret}
      JWT_EXP: 3600
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # pgsodium root key MUST be pinned: the image generates a random one on
      # every container (re)create and vault ciphertexts become undecryptable
      # when it changes. This host file persists the key across recreations.
      # NOTE: mounted as a file (not a directory) so it does not mask the
      # image's own /etc/postgresql-custom/*.conf files. Never delete it —
      # vault data is unrecoverable without it.
      #
      # FRESH DEPLOYMENT: create the key file BEFORE the first `docker compose
      # up` (if the file is missing, Docker creates a directory in its place
      # and the database fails to initialize). This is the same command the
      # Supabase image's own pgsodium_getkey.sh runs when the file is absent:
      #
      #   head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > docker/pgsodium_root.key
      #   chmod 644 docker/pgsodium_root.key
      - ./docker/pgsodium_root.key:/etc/postgresql-custom/pgsodium_root.key:ro
      - ./docker/supabase/roles.sql:/docker-entrypoint-initdb.d/z0_roles.sql:ro
      # App schema is NOT applied here (that only happens on an empty volume):
      # the one-shot `migrate` service below applies supabase/migrations on
      # every `docker compose up`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Applies new supabase/migrations/*.sql in order (tracked in
  # public.schema_migrations), then exits. The API waits for it, so a fresh
  # or existing database is always up to date before Muse starts.
  migrate:
    image: supabase/postgres:15.8.1.060
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${PUBLIC_URL:-http://localhost:8080}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      auth: { condition: service_started }
      rest: { condition: service_started }
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./supabase/templates:/usr/share/nginx/html/email-templates:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SUPABASE_URL: http://nginx:80
      QDRANT_URL: http://qdrant:6333
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      MUSIC_DOWNLOADER_URL: http://music-downloader:8001
    volumes:
      - ./music:/app/music:rw
    depends_on:
      migrate: { condition: service_completed_successfully }
      nginx: { condition: service_started }
      rest: { condition: service_started }
      auth: { condition: service_started }
      qdrant: { condition: service_started }
      music-downloader: { condition: service_started }
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
  music-downloader:
    build:
      context: .
      dockerfile: docker/music-downloader/Dockerfile
    container_name: muse-music-downloader
    restart: unless-stopped
    environment:
      PORT: 8001
      MUSIC_DIR: /music
    volumes:
      - ./music:/music:rw
    ports:
      - "127.0.0.1:8005:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on: [db]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:-http://localhost:8080},http://localhost:5174
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-32-character-minimum-secret}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "${DISABLE_SIGNUP:-false}"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Provider-neutral SMTP delivers Auth emails (signup, recovery, and
      # account-change confirmation/notifications). Configure these in .env.
      GOTRUE_SMTP_HOST: "${SMTP_HOST:-}"
      GOTRUE_SMTP_PORT: "${SMTP_PORT:-587}"
      GOTRUE_SMTP_USER: "${SMTP_USER:-}"
      GOTRUE_SMTP_PASS: "${SMTP_PASS:-}"
      GOTRUE_SMTP_ADMIN_EMAIL: "${SMTP_ADMIN_EMAIL:-noreply@example.com}"
      GOTRUE_SMTP_SENDER_NAME: "${SMTP_SENDER_NAME:-Muse}"
      GOTRUE_MAILER_AUTOCONFIRM: "${ENABLE_EMAIL_AUTOCONFIRM:-false}"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_NOTIFICATIONS_PASSWORD_CHANGED_ENABLED: "true"
      GOTRUE_MAILER_NOTIFICATIONS_EMAIL_CHANGED_ENABLED: "true"
      # Auth is exposed through Nginx below /auth/v1, so links in messages must
      # retain that gateway prefix.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://nginx/email-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://nginx/email-templates/email-change.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://nginx/email-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_PASSWORD_CHANGED_NOTIFICATION: http://nginx/email-templates/password-changed.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGED_NOTIFICATION: http://nginx/email-templates/email-changed.html
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-32-character-minimum-secret}
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]
volumes:
  postgres-data:
  qdrant-data:
